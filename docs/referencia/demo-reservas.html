<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo reservas barbería (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  /* Idea: la web sustituye a la libreta del barbero. Papel pautado, tinta, verde de fachada, latón. */
  --papel: #EDF1EC;
  --hoja: #FAFBF8;
  --tinta: #17221D;
  --tinta-suave: #4E5D55;
  --verde: #1F4A3A;
  --verde-claro: #D9E6DE;
  --laton: #A97B22;
  --renglon: #CBD6CE;
  --rojo: #A8261E;
  --rojo-claro: #F6E1DE;
  --f-rotulo: "Big Shoulders Display", "Arial Narrow", sans-serif;
  --f-texto: "Atkinson Hyperlegible", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--papel); color: var(--tinta); font: 16px/1.5 var(--f-texto); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--laton); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.num { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* Barra de la demo */
.barra { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; background: var(--tinta); color: var(--hoja); font-size: 14px; }
.barra p { margin: 0; flex: 1 1 260px; }
.barra .vistas { display: none; gap: 4px; background: #2c3a33; padding: 3px; border-radius: 8px; }
.barra .vistas button { border: 0; background: transparent; color: var(--hoja); padding: 6px 12px; border-radius: 6px; }
.barra .vistas button[aria-pressed="true"] { background: var(--hoja); color: var(--tinta); font-weight: 700; }
.barra .reiniciar { border: 1px solid #5d6d64; background: transparent; color: var(--hoja); padding: 6px 12px; border-radius: 6px; }

/* Escena: cliente a la izquierda, panel a la derecha */
.escena { display: grid; grid-template-columns: minmax(340px, 420px) minmax(0, 1fr); gap: 24px; padding: 24px; max-width: 1280px; margin: 0 auto; align-items: start; }
@media (max-width: 960px) {
  .escena { grid-template-columns: minmax(0, 1fr); padding: 16px; }
  .barra .vistas { display: flex; }
  .escena[data-vista="cliente"] .panel, .escena[data-vista="panel"] .cliente { display: none; }
}
.escena > section { min-width: 0; }
.etiqueta-vista { font-size: 13px; color: var(--tinta-suave); margin: 0 0 8px 4px; }

/* ---------- Cliente ---------- */
.cliente .marco { background: var(--hoja); border: 1px solid var(--renglon); border-radius: 18px; overflow: hidden; }
.rotulo { background: var(--verde); color: var(--hoja); padding: 22px 22px 18px; }
.rotulo h1 { font: 800 52px/0.9 var(--f-rotulo); letter-spacing: 0.01em; }
.rotulo p { margin: 6px 0 0; color: #cfe0d6; font-size: 15px; }
.rotulo .horario { margin-top: 12px; font-size: 14px; color: var(--hoja); display: grid; grid-template-columns: auto 1fr; gap: 0 12px; }

.pasos { list-style: none; margin: 0; padding: 0; }
.paso { padding: 20px 22px; border-top: 1px solid var(--renglon); }
.paso:first-child { border-top: 0; }
.paso h2 { display: flex; align-items: baseline; gap: 10px; font: 700 18px/1.2 var(--f-texto); margin-bottom: 12px; }
.paso h2 .n { font: 800 26px/1 var(--f-rotulo); color: var(--laton); min-width: 16px; }
.paso[aria-disabled="true"] { opacity: .45; pointer-events: none; }

.tarifa { list-style: none; margin: 0; padding: 0; }
.tarifa button { width: 100%; display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: baseline; text-align: left;
  background: none; border: 0; border-bottom: 1px dashed var(--renglon); padding: 10px 6px; border-radius: 0; }
.tarifa li:last-child button { border-bottom: 0; }
.tarifa .dur { color: var(--tinta-suave); font-size: 14px; }
.tarifa .precio { font: 800 22px/1 var(--f-rotulo); min-width: 44px; text-align: right; }
.tarifa button[aria-pressed="true"] { background: var(--verde-claro); border-radius: 8px; border-bottom-color: transparent; }
.tarifa button[aria-pressed="true"] .nombre { font-weight: 700; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--renglon); background: var(--hoja); padding: 8px 16px; border-radius: 999px; }
.chip[aria-pressed="true"] { border-color: var(--verde); background: var(--verde); color: var(--hoja); font-weight: 700; }
.chip:disabled { opacity: .45; cursor: not-allowed; text-decoration: line-through; }
.nota { font-size: 14px; color: var(--tinta-suave); margin: 8px 0 0; }

.dias { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.dia { flex: 0 0 58px; display: grid; justify-items: center; gap: 0; padding: 8px 0 6px; border: 1.5px solid var(--renglon); background: var(--hoja); border-radius: 10px; }
.dia .sem { font-size: 13px; color: var(--tinta-suave); }
.dia .d { font: 800 26px/1.05 var(--f-rotulo); }
.dia .q { font-size: 11px; color: var(--tinta-suave); }
.dia[aria-pressed="true"] { border-color: var(--verde); background: var(--verde); color: var(--hoja); }
.dia[aria-pressed="true"] .sem, .dia[aria-pressed="true"] .q { color: #cfe0d6; }
.dia:disabled { background: transparent; border-style: dashed; cursor: not-allowed; }
.dia:disabled .d { color: var(--tinta-suave); text-decoration: line-through; }

.franja { margin-top: 14px; }
.franja h3 { font-size: 14px; font-weight: 700; color: var(--tinta-suave); margin-bottom: 6px; }
.horas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.hora { padding: 9px 0; border: 1.5px solid var(--renglon); background: var(--hoja); border-radius: 8px; font-variant-numeric: tabular-nums; font-weight: 700; }
.hora[aria-pressed="true"] { background: var(--verde); border-color: var(--verde); color: var(--hoja); }
.vacio { padding: 14px; background: var(--papel); border-radius: 10px; color: var(--tinta-suave); margin: 12px 0 0; }

.aviso { display: flex; gap: 10px; padding: 12px 14px; border-radius: 10px; background: var(--rojo-claro); color: var(--rojo); font-weight: 700; margin: 0 0 12px; }

form .campo { display: grid; gap: 4px; margin-bottom: 12px; }
form label { font-weight: 700; font-size: 15px; }
form label small { font-weight: 400; color: var(--tinta-suave); }
form input[type="text"], form input[type="tel"], form input[type="email"], .panel select, .panel input[type="text"], .panel input[type="tel"] {
  width: 100%; padding: 11px 12px; border: 1.5px solid var(--renglon); border-radius: 8px; background: var(--hoja); }
form input[aria-invalid="true"] { border-color: var(--rojo); }
.error { color: var(--rojo); font-size: 14px; margin: 0; }
.check { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; font-size: 15px; margin: 4px 0 14px; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--verde); }
.trampa { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.boton { width: 100%; border: 0; background: var(--verde); color: var(--hoja); padding: 15px; border-radius: 10px; font-weight: 700; font-size: 17px; }
.boton:disabled { background: var(--renglon); color: var(--tinta-suave); cursor: not-allowed; }
.secundario { border: 1.5px solid var(--renglon); background: var(--hoja); padding: 11px 14px; border-radius: 10px; font-weight: 700; }

.prueba { margin-top: 14px; padding: 12px 14px; border: 1.5px dashed var(--laton); border-radius: 10px; font-size: 14px; color: var(--tinta-suave); }
.prueba button { margin-top: 8px; border: 0; background: none; color: var(--laton); font-weight: 700; padding: 0; text-decoration: underline; text-underline-offset: 3px; }

/* Ticket de confirmación */
.ticket { padding: 26px 22px 22px; }
.ticket .sello { font: 800 44px/0.95 var(--f-rotulo); color: var(--verde); }
.ticket .cuando { font-size: 20px; font-weight: 700; margin: 10px 0 0; }
.ticket dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 18px 0; padding: 16px 0; border-top: 1px dashed var(--renglon); border-bottom: 1px dashed var(--renglon); }
.ticket dt { color: var(--tinta-suave); }
.ticket dd { margin: 0; font-weight: 700; }
.ticket .acciones { display: grid; gap: 8px; }
.ticket.cancelada .sello { color: var(--rojo); }

/* ---------- Panel ---------- */
.panel .marco { background: var(--hoja); border: 1px solid var(--renglon); border-radius: 18px; overflow: hidden; }
.cab-panel { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--renglon); }
.cab-panel h2 { font: 800 34px/1 var(--f-rotulo); }
.nav-dia { display: flex; align-items: center; gap: 6px; }
.nav-dia button { border: 1.5px solid var(--renglon); background: var(--hoja); width: 38px; height: 38px; border-radius: 8px; font-size: 18px; }
.nav-dia .hoy { width: auto; padding: 0 12px; font-size: 15px; }
.nav-dia .fecha { min-width: 190px; text-align: center; font-weight: 700; }
.resumen { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 10px 20px; font-size: 15px; background: var(--papel); border-bottom: 1px solid var(--renglon); align-items: center; }
.resumen strong { font: 800 22px/1 var(--f-rotulo); margin-right: 4px; }
.resumen .nueva { margin-left: auto; border: 0; background: var(--verde); color: var(--hoja); padding: 9px 14px; border-radius: 8px; font-weight: 700; }

.alta { padding: 16px 20px; border-bottom: 1px solid var(--renglon); background: var(--verde-claro); display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: end; }
.alta .campo { display: grid; gap: 4px; }
.alta label { font-size: 14px; font-weight: 700; }
.alta .fila-botones { display: flex; gap: 8px; }
.alta .error { grid-column: 1 / -1; }

.libreta { display: grid; position: relative; overflow-x: auto; }
.col-horas, .col-prof { display: grid; grid-template-rows: 44px repeat(var(--filas), 20px); }
.libreta-in { display: grid; grid-template-columns: 56px repeat(var(--cols), minmax(150px, 1fr)); min-width: 420px; position: relative; }
.col-horas div { font-size: 12px; color: var(--tinta-suave); padding-right: 8px; text-align: right; transform: translateY(-8px); font-variant-numeric: tabular-nums; }
.col-prof { border-left: 1px solid var(--renglon); position: relative;
  background-image: repeating-linear-gradient(to bottom, transparent 0 19px, var(--renglon) 19px 20px);
  background-position: 0 44px; background-repeat: no-repeat; background-size: 100% calc(100% - 44px); }
.col-prof .nombre-prof { grid-row: 1; display: flex; align-items: center; gap: 8px; padding: 0 10px; font-weight: 700; background: var(--hoja); border-bottom: 1.5px solid var(--tinta); }
.col-prof .nombre-prof i { width: 12px; height: 12px; border-radius: 50%; }
.cerrado { background: repeating-linear-gradient(135deg, var(--papel) 0 6px, transparent 6px 12px); }
.cita { margin: 1px 4px; border-radius: 6px; padding: 3px 8px; font-size: 13px; line-height: 1.25; color: var(--hoja); text-align: left; border: 0; overflow: hidden; position: relative; }
.cita b { display: block; font-size: 13px; }
.cita span { opacity: .85; }
.cita.web::after { content: "web"; position: absolute; top: 3px; right: 6px; font-size: 11px; font-weight: 700; background: var(--hoja); color: var(--tinta); padding: 0 5px; border-radius: 4px; }
.cita.nueva { box-shadow: 0 0 0 3px var(--laton); animation: latido 1.2s ease-out 2; }
@keyframes latido { 50% { box-shadow: 0 0 0 7px rgba(169,123,34,.25); } }
.cita.pasada { opacity: .55; }
.ahora { position: absolute; left: 56px; right: 0; height: 2px; background: var(--rojo); z-index: 2; pointer-events: none; }
.ahora::before { content: ""; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--rojo); }
.dia-cerrado { padding: 40px 20px; text-align: center; color: var(--tinta-suave); }

.detalle { margin: 0 20px 20px; padding: 14px 16px; border: 1.5px solid var(--tinta); border-radius: 12px; display: grid; gap: 4px; }
.detalle h3 { font-size: 17px; }
.detalle .fila-botones { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.peligro { border: 0; background: var(--rojo); color: var(--hoja); padding: 9px 14px; border-radius: 8px; font-weight: 700; }
</style>
</head>
<body>
<div class="barra">
  <p>Demo con datos de prueba: reserva como cliente y mira cómo aparece en la agenda del barbero. Nada se guarda al recargar.</p>
  <div class="vistas" role="group" aria-label="Vista">
    <button type="button" id="ver-cliente" aria-pressed="true">Cliente</button>
    <button type="button" id="ver-panel" aria-pressed="false">Barbero</button>
  </div>
  <button type="button" class="reiniciar" id="reiniciar">Reiniciar demo</button>
</div>

<main class="escena" id="escena" data-vista="cliente">
  <section class="cliente" aria-label="Página de reservas del cliente">
    <p class="etiqueta-vista">Lo que ve el cliente en el móvil</p>
    <div class="marco" id="cliente"></div>
  </section>
  <section class="panel" aria-label="Panel del barbero">
    <p class="etiqueta-vista">Lo que ve el barbero</p>
    <div class="marco" id="panel"></div>
  </section>
</main>

<script>
(function () {
  const D = window.Demo;
  const TZ = D.NEGOCIO.zona_horaria;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (opts) => new Intl.DateTimeFormat('es-ES', { timeZone: TZ, ...opts });
  const fDiaLargo = fmt({ weekday: 'long', day: 'numeric', month: 'long' });
  const fSem = fmt({ weekday: 'short' });
  const fNum = fmt({ day: 'numeric' });
  const mediodia = (f) => D.horaLocalAUtc(f, '12:00', TZ);
  const ahora = () => new Date();

  let bd, cli, pan;
  function iniciar() {
    bd = new D.BdSimulada(ahora());
    cli = { servicio: 1, profesional: 'cualquiera', fecha: null, inicio: null, form: { nombre: '', telefono: '', email: '', privacidad: false },
            errores: {}, aviso: null, confirmada: null, cancelada: false };
    pan = { fecha: D.fechaLocal(ahora(), TZ), detalle: null, alta: null, nuevaId: null, confirmarCancelar: false };
    pintar();
  }

  // ---------- Cliente ----------
  const servicio = () => bd.servicios.find((s) => s.id === cli.servicio);
  const hace = (p, s) => bd.profServ.some(([a, b]) => a === p && b === s);

  function proximosDias() {
    const hoy = D.fechaLocal(ahora(), TZ);
    const dias = [];
    for (let i = 0; i < 14; i++) {
      const f = D.sumarDias(hoy, i);
      const abierto = bd.horarios.some((h) => h.dia_semana === D.diaSemanaISO(f));
      const huecos = abierto ? D.getHuecos(bd, cli.servicio, cli.profesional, f, ahora()) || [] : [];
      dias.push({ fecha: f, abierto, libres: huecos.length, huecos });
    }
    return dias;
  }

  function pintarCliente() {
    const raiz = document.getElementById('cliente');
    const cab = `<header class="rotulo"><h1>La Navaja</h1><p>Barbería en Sants (negocio de ejemplo)</p>
      <div class="horario"><span>Lun a vie</span><span>9 a 14 h y 16 a 20 h</span><span>Sábado</span><span>10 a 14 h</span></div></header>`;

    if (cli.confirmada) {
      const c = cli.confirmada;
      const s = bd.servicios.find((x) => x.nombre === c.servicio);
      raiz.innerHTML = cab + `<div class="ticket ${cli.cancelada ? 'cancelada' : ''}" aria-live="polite">
        <p class="sello">${cli.cancelada ? 'Cita cancelada' : 'Reserva hecha'}</p>
        <p class="cuando">${esc(capital(fDiaLargo.format(new Date(c.inicio))))}, a las ${esc(c.hora)}</p>
        <dl><dt>Servicio</dt><dd>${esc(c.servicio)}</dd><dt>Con</dt><dd>${esc(c.profesional)}</dd>
        <dt>Precio</dt><dd>${s ? s.precio + ' €' : ''}</dd><dt>A nombre de</dt><dd>${esc(cli.form.nombre)}</dd></dl>
        <p class="nota">${cli.cancelada ? 'La hora vuelve a estar libre para otros clientes.' : 'En la app real te llegará un email con esta información y un enlace para cancelar. Si no puedes venir, cancélala para que otro cliente pueda usar la hora.'}</p>
        <div class="acciones" style="margin-top:16px">
          ${cli.cancelada ? '' : '<button type="button" class="secundario" id="cancelar-mia">Cancelar esta cita</button>'}
          <button type="button" class="boton" id="otra">Hacer otra reserva</button></div></div>`;
      document.getElementById('otra').onclick = () => { cli.confirmada = null; cli.cancelada = false; cli.inicio = null; cli.form.privacidad = false; pintar(); };
      const cm = document.getElementById('cancelar-mia');
      if (cm) cm.onclick = () => { bd.cancelar(c.id); cli.cancelada = true; pintar(); };
      return;
    }

    const dias = proximosDias();
    if (!cli.fecha || !dias.find((d) => d.fecha === cli.fecha && d.libres > 0)) cli.fecha = (dias.find((d) => d.libres > 0) || dias[0]).fecha;
    const diaSel = dias.find((d) => d.fecha === cli.fecha);
    if (cli.inicio && !diaSel.huecos.find((h) => h.inicio === cli.inicio)) cli.inicio = null;
    const s = servicio();

    const tarifa = bd.servicios.map((x) => `<li><button type="button" data-serv="${x.id}" aria-pressed="${x.id === cli.servicio}">
      <span class="nombre">${esc(x.nombre)}</span><span class="dur num">${x.duracion_min} min</span><span class="precio num">${x.precio} €</span></button></li>`).join('');

    const chips = [`<button type="button" class="chip" data-prof="cualquiera" aria-pressed="${cli.profesional === 'cualquiera'}">Me da igual</button>`]
      .concat(bd.profesionales.map((p) => `<button type="button" class="chip" data-prof="${p.id}" aria-pressed="${cli.profesional === p.id}" ${hace(p.id, s.id) ? '' : 'disabled'}>${esc(p.nombre)}</button>`)).join('');
    const noHacen = bd.profesionales.filter((p) => !hace(p.id, s.id)).map((p) => p.nombre);

    const tiras = dias.map((d) => {
      const fecha = mediodia(d.fecha);
      const q = !d.abierto ? 'cerrado' : d.libres === 0 ? 'completo' : `${d.libres} libres`;
      return `<button type="button" class="dia" data-dia="${d.fecha}" aria-pressed="${d.fecha === cli.fecha}" ${d.libres === 0 ? 'disabled' : ''}
        aria-label="${esc(fDiaLargo.format(fecha))}, ${q}"><span class="sem">${esc(fSem.format(fecha).replace('.', ''))}</span>
        <span class="d num">${fNum.format(fecha)}</span><span class="q">${q}</span></button>`;
    }).join('');

    const boton = (h) => `<button type="button" class="hora" data-hora="${h.inicio}" aria-pressed="${h.inicio === cli.inicio}">${h.hora}</button>`;
    const man = diaSel.huecos.filter((h) => h.hora < '15:00'), tar = diaSel.huecos.filter((h) => h.hora >= '15:00');
    const horas = diaSel.huecos.length === 0 ? `<p class="vacio">No quedan horas libres este día. Prueba otro día${cli.profesional !== 'cualquiera' ? ' o elige «Me da igual»' : ''}.</p>` :
      (man.length ? `<div class="franja"><h3>Mañana</h3><div class="horas">${man.map(boton).join('')}</div></div>` : '') +
      (tar.length ? `<div class="franja"><h3>Tarde</h3><div class="horas">${tar.map(boton).join('')}</div></div>` : '');

    const e = cli.errores, f = cli.form;
    const campo = (id, etiqueta, tipo, extra = '') => `<div class="campo"><label for="${id}">${etiqueta}</label>
      <input id="${id}" name="${id}" type="${tipo}" value="${esc(f[id])}" ${e[id] ? 'aria-invalid="true" aria-describedby="err-' + id + '"' : ''} ${extra}>
      ${e[id] ? `<p class="error" id="err-${id}">${esc(e[id])}</p>` : ''}</div>`;
    const resumenBoton = cli.inicio ? `Reservar ${esc(fDiaLargo.format(new Date(cli.inicio)))} a las ${esc(D.formatearHora(new Date(cli.inicio), TZ))}` : 'Elige una hora para reservar';

    raiz.innerHTML = cab + `<ol class="pasos">
      <li class="paso"><h2><span class="n">1</span>Qué te hacemos</h2><ul class="tarifa">${tarifa}</ul></li>
      <li class="paso"><h2><span class="n">2</span>Con quién</h2><div class="chips">${chips}</div>
        ${noHacen.length ? `<p class="nota">${esc(noHacen.join(' y '))} no hace ${esc(s.nombre.toLowerCase())}.</p>` : ''}</li>
      <li class="paso" id="paso-cuando"><h2><span class="n">3</span>Cuándo</h2>
        ${cli.aviso ? `<p class="aviso" role="alert">${esc(cli.aviso)}</p>` : ''}
        <div class="dias">${tiras}</div><p class="nota">${esc(capital(fDiaLargo.format(mediodia(cli.fecha))))}</p>${horas}
        ${cli.inicio ? `<div class="prueba">Para probar qué pasa si dos personas reservan a la vez:<br>
          <button type="button" id="robar">Simular que otra persona coge esta hora antes que tú</button></div>` : ''}</li>
      <li class="paso" aria-disabled="${!cli.inicio}"><h2><span class="n">4</span>Tus datos</h2>
        <form id="form" novalidate>
          ${campo('nombre', 'Nombre', 'text', 'autocomplete="given-name"')}
          ${campo('telefono', 'Teléfono', 'tel', 'autocomplete="tel" inputmode="tel" placeholder="611 22 33 44"')}
          ${campo('email', 'Email <small>(opcional, para recibir la confirmación)</small>', 'email', 'autocomplete="email"')}
          <div class="trampa" aria-hidden="true"><label for="web">No rellenes este campo</label><input id="web" name="web" type="text" tabindex="-1" autocomplete="off"></div>
          <label class="check"><input type="checkbox" id="privacidad" ${f.privacidad ? 'checked' : ''}>
            <span>Acepto que La Navaja guarde mi nombre y teléfono para gestionar la cita (política de privacidad).</span></label>
          ${e.aceptaPrivacidad ? `<p class="error">${esc(e.aceptaPrivacidad)}</p>` : ''}
          <button class="boton" type="submit" ${cli.inicio ? '' : 'disabled'}>${resumenBoton}</button>
        </form></li></ol>`;

    raiz.querySelectorAll('[data-serv]').forEach((b) => b.onclick = () => {
      cli.servicio = +b.dataset.serv; cli.inicio = null; cli.aviso = null;
      if (cli.profesional !== 'cualquiera' && !hace(cli.profesional, cli.servicio)) cli.profesional = 'cualquiera';
      pintar();
    });
    raiz.querySelectorAll('[data-prof]').forEach((b) => b.onclick = () => { cli.profesional = b.dataset.prof === 'cualquiera' ? 'cualquiera' : +b.dataset.prof; cli.inicio = null; cli.aviso = null; pintar(); });
    raiz.querySelectorAll('[data-dia]').forEach((b) => b.onclick = () => { cli.fecha = b.dataset.dia; cli.inicio = null; cli.aviso = null; pintar(); });
    raiz.querySelectorAll('[data-hora]').forEach((b) => b.onclick = () => { cli.inicio = b.dataset.hora; cli.aviso = null; pintar(); document.getElementById('nombre')?.focus({ preventScroll: true }); });
    const robar = document.getElementById('robar');
    if (robar) robar.onclick = () => {
      const h = diaSel.huecos.find((x) => x.inicio === cli.inicio);
      h.profesionales.forEach((p) => bd.crearCita({ servicioId: cli.servicio, candidatos: [p], inicio: new Date(h.inicio), nombre: 'Otro cliente',
        telefono: '+3469' + String(Math.floor(1000000 + Math.random() * 8999999)), origen: 'web' }, ahora()));
      cli.aviso = null; pan.fecha = cli.fecha; pintarPanel();
      robar.parentElement.innerHTML = 'Hecho: otra persona acaba de reservar esa hora. Ahora pulsa el botón de reservar y verás qué pasa.';
    };
    const form = document.getElementById('form');
    form.querySelectorAll('input').forEach((i) => i.oninput = () => { if (i.id in cli.form) cli.form[i.id] = i.type === 'checkbox' ? i.checked : i.value; });
    form.onsubmit = (ev) => {
      ev.preventDefault();
      cli.form.privacidad = document.getElementById('privacidad').checked;
      const cuerpo = { negocio: D.NEGOCIO.slug, servicio: cli.servicio, profesional: cli.profesional, inicio: cli.inicio,
        nombre: cli.form.nombre, telefono: cli.form.telefono, email: cli.form.email, aceptaPrivacidad: cli.form.privacidad,
        web: document.getElementById('web').value };
      const r = D.postCitas(bd, cuerpo, ahora());
      cli.errores = {};
      if (r.estado === 201) {
        cli.confirmada = r.json.cita; pan.fecha = r.json.cita.fecha; pan.nuevaId = r.json.cita.id; pan.detalle = null;
      } else if (r.estado === 400 && r.json.errores) {
        cli.errores = r.json.errores;
      } else {
        cli.aviso = r.json.error; cli.inicio = null;
      }
      pintar();
      if (cli.aviso) document.getElementById('paso-cuando').scrollIntoView({ behavior: 'smooth', block: 'start' });
      else if (Object.keys(cli.errores).length) document.querySelector('[aria-invalid="true"]')?.focus();
    };
  }

  // ---------- Panel ----------
  const INICIO_DIA = 9 * 60, FIN_DIA = 20 * 60, PASO = 15;
  const minutosLocal = (d) => { const [h, m] = D.formatearHora(d, TZ).split(':').map(Number); return h * 60 + m; };

  function pintarPanel() {
    const raiz = document.getElementById('panel');
    const fecha = pan.fecha, hoy = D.fechaLocal(ahora(), TZ);
    const dia = D.diaSemanaISO(fecha);
    const tramos = bd.horarios.filter((h) => h.dia_semana === dia);
    const citas = bd.citas.filter((c) => c.estado !== 'cancelada' && D.fechaLocal(c.inicio, TZ) === fecha);
    const web = citas.filter((c) => c.origen === 'web').length;
    const caja = citas.reduce((t, c) => t + (bd.servicios.find((s) => s.id === c.servicio_id)?.precio || 0), 0);
    const filas = (FIN_DIA - INICIO_DIA) / PASO;
    const fila = (min) => Math.round((min - INICIO_DIA) / PASO) + 2;

    let cuerpo;
    if (tramos.length === 0) cuerpo = `<p class="dia-cerrado">Domingo: cerrado.</p>`;
    else {
      let horas = '<div class="col-horas" style="--filas:' + filas + '"><div></div>';
      for (let m = INICIO_DIA; m < FIN_DIA; m += PASO) horas += `<div style="grid-row:${fila(m)}">${m % 60 === 0 ? `${String(m / 60).padStart(2, '0')}:00` : ''}</div>`;
      horas += '</div>';
      const cols = bd.profesionales.map((p) => {
        const suyos = tramos.filter((t) => t.profesional_id === p.id).map((t) => [toMin(t.hora_inicio), toMin(t.hora_fin)]);
        let cerr = '';
        for (let m = INICIO_DIA; m < FIN_DIA; m += PASO) if (!suyos.some(([a, b]) => m >= a && m < b)) cerr += `<div class="cerrado" style="grid-row:${fila(m)}"></div>`;
        const bloques = citas.filter((c) => c.profesional_id === p.id).map((c) => {
          const cl = bd.clientes.find((x) => x.id === c.cliente_id), s = bd.servicios.find((x) => x.id === c.servicio_id);
          const a = minutosLocal(c.inicio), b = minutosLocal(c.fin);
          const clases = ['cita', c.origen === 'web' ? 'web' : '', c.id === pan.nuevaId ? 'nueva' : '', c.fin < ahora() ? 'pasada' : ''].join(' ');
          return `<button type="button" class="${clases}" data-cita="${c.id}" style="grid-row:${fila(a)} / ${fila(b)};background:${p.color}"
            aria-label="${esc(D.formatearHora(c.inicio, TZ))}, ${esc(cl.nombre)}, ${esc(s.nombre)}"><b>${esc(cl.nombre)}</b>${b - a > 20 ? `<span>${esc(D.formatearHora(c.inicio, TZ))} ${esc(s.nombre)}</span>` : ''}</button>`;
        }).join('');
        return `<div class="col-prof" style="--filas:${filas}"><div class="nombre-prof"><i style="background:${p.color}"></i>${esc(p.nombre)}</div>${cerr}${bloques}</div>`;
      }).join('');
      let linea = '';
      if (fecha === hoy) { const m = minutosLocal(ahora()); if (m >= INICIO_DIA && m <= FIN_DIA) linea = `<div class="ahora" style="top:${44 + (m - INICIO_DIA) / PASO * 20}px" title="Ahora"></div>`; }
      cuerpo = `<div class="libreta"><div class="libreta-in" style="--cols:${bd.profesionales.length}">${horas}${cols}${linea}</div></div>`;
    }

    let detalle = '';
    if (pan.detalle) {
      const c = bd.citas.find((x) => x.id === pan.detalle);
      if (c && c.estado !== 'cancelada') {
        const cl = bd.clientes.find((x) => x.id === c.cliente_id), s = bd.servicios.find((x) => x.id === c.servicio_id), p = bd.profesionales.find((x) => x.id === c.profesional_id);
        detalle = `<div class="detalle" aria-live="polite"><h3>${esc(cl.nombre)}</h3>
          <span>${esc(D.formatearHora(c.inicio, TZ))} a ${esc(D.formatearHora(c.fin, TZ))} con ${esc(p.nombre)}</span>
          <span>${esc(s.nombre)}, ${s.precio} €</span><span>Teléfono ${esc(cl.telefono)}${cl.email ? ', ' + esc(cl.email) : ''}</span>
          <span>${c.origen === 'web' ? 'Reservada por el cliente desde la web' : 'Apuntada desde el panel'}</span>
          <div class="fila-botones">${pan.confirmarCancelar
            ? '<button type="button" class="peligro" id="si-cancelar">Sí, cancelar la cita</button><button type="button" class="secundario" id="no-cancelar">No</button>'
            : '<button type="button" class="secundario" id="pedir-cancelar">Cancelar cita</button><button type="button" class="secundario" id="cerrar-detalle">Cerrar</button>'}</div></div>`;
      }
    }

    raiz.innerHTML = `<div class="cab-panel"><h2>Agenda</h2><div class="nav-dia">
        <button type="button" id="ant" aria-label="Día anterior">‹</button><span class="fecha">${esc(capital(fDiaLargo.format(mediodia(fecha))))}</span>
        <button type="button" id="sig" aria-label="Día siguiente">›</button><button type="button" class="hoy" id="hoy">Hoy</button></div></div>
      <div class="resumen"><span><strong class="num">${citas.length}</strong>citas</span><span><strong class="num">${web}</strong>desde la web</span>
        <span><strong class="num">${caja}</strong>€ previstos</span>
        ${tramos.length ? '<button type="button" class="nueva" id="nueva">Apuntar cita por teléfono</button>' : ''}</div>
      ${pan.alta ? altaHtml() : ''}${detalle}${cuerpo}`;

    raiz.querySelector('#ant').onclick = () => { pan.fecha = D.sumarDias(pan.fecha, -1); pan.detalle = null; pintarPanel(); };
    raiz.querySelector('#sig').onclick = () => { pan.fecha = D.sumarDias(pan.fecha, 1); pan.detalle = null; pintarPanel(); };
    raiz.querySelector('#hoy').onclick = () => { pan.fecha = hoy; pan.detalle = null; pintarPanel(); };
    raiz.querySelector('#nueva')?.addEventListener('click', () => { pan.alta = pan.alta ? null : { prof: bd.profesionales[0].id, serv: 1, inicio: '', nombre: '', telefono: '', error: '' }; pintarPanel(); });
    raiz.querySelectorAll('[data-cita]').forEach((b) => b.onclick = () => { pan.detalle = +b.dataset.cita; pan.confirmarCancelar = false; pintarPanel(); });
    raiz.querySelector('#pedir-cancelar')?.addEventListener('click', () => { pan.confirmarCancelar = true; pintarPanel(); });
    raiz.querySelector('#no-cancelar')?.addEventListener('click', () => { pan.confirmarCancelar = false; pintarPanel(); });
    raiz.querySelector('#cerrar-detalle')?.addEventListener('click', () => { pan.detalle = null; pintarPanel(); });
    raiz.querySelector('#si-cancelar')?.addEventListener('click', () => {
      bd.cancelar(pan.detalle);
      if (cli.confirmada && cli.confirmada.id === pan.detalle) cli.cancelada = true;
      pan.detalle = null; pan.confirmarCancelar = false; pintar();
    });
    if (pan.alta) enlazarAlta(raiz);
  }

  function altaHtml() {
    const a = pan.alta;
    const huecos = D.getHuecos(bd, a.serv, a.prof, pan.fecha, ahora()) || [];
    if (!huecos.find((h) => h.inicio === a.inicio)) a.inicio = huecos[0]?.inicio || '';
    const servs = bd.servicios.filter((s) => hace(a.prof, s.id));
    return `<form class="alta" id="alta" novalidate>
      <div class="campo"><label for="a-prof">Barbero</label><select id="a-prof">${bd.profesionales.map((p) => `<option value="${p.id}" ${p.id === a.prof ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('')}</select></div>
      <div class="campo"><label for="a-serv">Servicio</label><select id="a-serv">${servs.map((s) => `<option value="${s.id}" ${s.id === a.serv ? 'selected' : ''}>${esc(s.nombre)}</option>`).join('')}</select></div>
      <div class="campo"><label for="a-hora">Hora</label><select id="a-hora" ${huecos.length ? '' : 'disabled'}>${huecos.length ? huecos.map((h) => `<option value="${h.inicio}" ${h.inicio === a.inicio ? 'selected' : ''}>${h.hora}</option>`).join('') : '<option>Sin horas libres</option>'}</select></div>
      <div class="campo"><label for="a-nombre">Nombre</label><input id="a-nombre" type="text" value="${esc(a.nombre)}"></div>
      <div class="campo"><label for="a-tel">Teléfono</label><input id="a-tel" type="tel" inputmode="tel" value="${esc(a.telefono)}"></div>
      <div class="fila-botones"><button type="submit" class="nueva boton" style="padding:11px">Guardar cita</button></div>
      ${a.error ? `<p class="error" role="alert">${esc(a.error)}</p>` : ''}</form>`;
  }

  function enlazarAlta(raiz) {
    const a = pan.alta;
    raiz.querySelector('#a-prof').onchange = (e) => { a.prof = +e.target.value; if (!hace(a.prof, a.serv)) a.serv = 1; a.error = ''; pintarPanel(); };
    raiz.querySelector('#a-serv').onchange = (e) => { a.serv = +e.target.value; a.error = ''; pintarPanel(); };
    raiz.querySelector('#a-hora').onchange = (e) => { a.inicio = e.target.value; };
    raiz.querySelector('#a-nombre').oninput = (e) => { a.nombre = e.target.value; };
    raiz.querySelector('#a-tel').oninput = (e) => { a.telefono = e.target.value; };
    raiz.querySelector('#alta').onsubmit = (ev) => {
      ev.preventDefault();
      const tel = D.normalizarTelefono(a.telefono);
      if (a.nombre.trim().length < 2) { a.error = 'Escribe el nombre del cliente.'; return pintarPanel(); }
      if (!tel) { a.error = 'Escribe un teléfono válido.'; return pintarPanel(); }
      if (!a.inicio) { a.error = 'No quedan horas libres ese día para ese servicio.'; return pintarPanel(); }
      const r = bd.crearCita({ servicioId: a.serv, candidatos: [a.prof], inicio: new Date(a.inicio), nombre: a.nombre.trim(), telefono: tel, origen: 'panel' }, ahora());
      if (!r.ok) { a.error = D.traducirErrorCita(r.mensaje).mensaje; return pintarPanel(); }
      pan.nuevaId = r.valor.id; pan.alta = null; pintar();
    };
  }

  const toMin = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  const capital = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  function pintar() { pintarCliente(); pintarPanel(); }

  // Vistas (móvil)
  const escena = document.getElementById('escena');
  const vc = document.getElementById('ver-cliente'), vp = document.getElementById('ver-panel');
  const ver = (v) => { escena.dataset.vista = v; vc.setAttribute('aria-pressed', v === 'cliente'); vp.setAttribute('aria-pressed', v === 'panel'); };
  vc.onclick = () => ver('cliente'); vp.onclick = () => ver('panel');
  document.getElementById('reiniciar').onclick = iniciar;

  iniciar();
})();
</script>
</body>
</html>
